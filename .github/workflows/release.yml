name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One run per tag. Not cancel-in-progress: a half-finished signing job that gets
# cancelled is harmless, but a cancelled *publish* can leave a release with some
# of its assets, which is worse than waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job opts into exactly what it needs. The signing job
# never gets `contents: write`, and the publishing job never sees the signing
# secrets — see the comment on the `release` job.
permissions: {}

jobs:
  build:
    name: Build, sign and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      apk_name: ${{ steps.metadata.outputs.apk_name }}
      fingerprint: ${{ steps.verify.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap guard, before the six-minute build. The authoritative check runs
      # after assembling, against what was actually built; this one just turns
      # "tagged without bumping the version" into a five-second failure.
      - name: Check the tag matches appVersionName
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP="$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [ -z "$APP" ]; then
            echo "::error::could not read appVersionName from app/build.gradle.kts — this guard cannot run"
            exit 1
          fi
          if [ "$TAG" != "$APP" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match appVersionName '$APP' — bump the version in app/build.gradle.kts before tagging"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          # JetBrains, not Temurin: gradle/gradle-daemon-jvm.properties pins
          # toolchainVendor=JETBRAINS. With any other vendor installed, Gradle
          # downloads one into ~/.gradle/jdks on every run. android.yml has said
          # this since it was written; this workflow used temurin and paid that
          # download on every release until 2026-09-20.
          distribution: jetbrains
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # See the matching comment in android.yml: the action's default package
          # list requests the legacy "tools" package, removed from Google's SDK
          # manifest on 2026-09-14. An empty value still sets ANDROID_HOME and
          # pre-accepts the licences; AGP provisions the platform and
          # build-tools it needs, including the apksigner used to verify below.
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Matches android.yml: "basic" is the MIT-licensed cache provider.
          # The default "enhanced" one is under Gradle's commercial terms.
          cache-provider: basic
          # cache-read-only is deliberately NOT set. The action already writes
          # only on the default branch and reads everywhere else, which is the
          # behaviour wanted here: a tag build can never poison main's cache.
          # Forcing it to true additionally blocked writes on main, and since
          # GitHub scopes a cache written on refs/tags/X so that refs/tags/Y
          # cannot see it, and this workflow otherwise only runs on tags, no
          # entry could ever be created that a later release could restore --
          # every release build started from empty state.
          #
          # To warm it: run this workflow manually (workflow_dispatch) on main.
          # That writes the default-branch entry for this job, which every
          # subsequent tag build restores, and doubles as a dry run of the
          # signing path without publishing anything (the release job is gated
          # on github.ref_type == 'tag').

      # No `chmod +x ./gradlew`: it is mode 100755 in git, so the checkout is
      # already executable.

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # An unset secret expands to an empty string, which would base64-decode
          # to an empty file. app/build.gradle.kts treats a missing keystore as
          # "build unsigned" by design, so without this check a misconfigured
          # repository would publish an unsigned APK and report success.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to build a release that would silently be unsigned. See docs/SIGNING.md §3."
            exit 1
          fi
          # printf, not echo: some shells' echo mangles backslashes in a long blob.
          # $RUNNER_TEMP, not the workspace: a keystore inside the checkout can be
          # swept up by an artifact upload with a careless path glob.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Run unit tests and assemble the signed release APK
        env:
          # Read by the signing config in app/build.gradle.kts, which prefers
          # keystore.properties (absent here) and falls back to these.
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Optional: blank falls back to the store password, which is the case
          # for a PKCS12 keystore made by `keytool -genkeypair -storetype PKCS12`.
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # android.yml runs on pushes to main and on PRs, so a tag build is
        # otherwise untested code: the tagged commit gets the unit suite here.
        # Release lint needs no separate task — `lint { checkReleaseBuilds = true }`
        # puts lintVitalRelease inside assembleRelease already.
        run: >
          ./gradlew
          testDebugUnitTest :core:model:test :core:common:test
          :app:assembleRelease
          --stacktrace

      - name: Verify the APK is signed with our key
        id: verify
        # Two checks, neither of which parses apksigner's wording (its signer
        # labels differ between build-tools versions, which broke this step
        # three times): apksigner's exit code says the APK is signed and
        # consistent; then the SHA-256 of the certificate in the keystore we
        # just decoded must appear in its output. `apksigner verify` alone would
        # pass a debug-signed APK, and an unsigned build is otherwise a green
        # run, because app/build.gradle.kts builds unsigned when no keystore is
        # configured. No fingerprint is hardcoded, so a key rotation cannot fail
        # the build for the wrong reason.
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk)"   # one fat APK, no ABI splits
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"

          # The cert's SHA-256 is the hash of its DER encoding, which is what
          # keytool writes. -file rather than stdout: on failure keytool prints
          # its error to stdout, which would otherwise be hashed as a "cert".
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_FILE" \
            -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -file "$RUNNER_TEMP/cert.der"
          FP="$(sha256sum "$RUNNER_TEMP/cert.der" | cut -d' ' -f1)"

          # --min-sdk-version: without it apksigner assumes minSdk 1 and reports
          # the deliberately absent v1 block as a failure (enableV1Signing=false).
          "$APKSIGNER" verify --min-sdk-version 26 --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -qiF "$FP" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::$APK is not signed with the certificate in our keystore (expected SHA-256 $FP)"
            exit 1
          fi
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore from the runner
        if: always()
        # The runner is ephemeral, so this is belt-and-braces — and the one line
        # that has to stay if this ever moves to a self-hosted runner.
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Read build metadata and checksum the APK
        id: metadata
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          META="$OUT/output-metadata.json"
          # ABI splits are disabled (see app/build.gradle.kts), so there is a
          # single fat APK and no need to filter for the ABI-less element.
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$META")
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$META")
          APK_NAME=$(jq -r '.elements[0].outputFile' "$META")
          # Written from inside the directory so the path in the file is bare and
          # `sha256sum -c` works wherever a user unpacks the download.
          ( cd "$OUT" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "apk_name=$APK_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "--- built ---"
          ls -l "$OUT"/*.apk "$OUT"/*.sha256

      - name: Verify the built APK's version matches the tag
        if: github.ref_type == 'tag'
        # The authoritative check: reads what was actually built, not the source.
        # It lives in this job so a mismatch fails before anything is uploaded.
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version_name }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${BUILD_VERSION#v}" ]; then
            echo "::error::git tag ($TAG_VERSION) doesn't match the built APK's version ($BUILD_VERSION)"
            exit 1
          fi

      - name: Upload the signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          # Explicit globs: the same directory also holds output-metadata.json
          # and a baselineProfiles/ tree, neither of which belongs in a release.
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job writes, and it holds no signing secrets
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apk
          path: release-apk

      - name: Compose the release body
        run: |
          set -euo pipefail
          APK="${{ needs.build.outputs.apk_name }}"
          cat > body.md <<EOF
          NoSpam ${{ needs.build.outputs.version_name }} (versionCode ${{ needs.build.outputs.version_code }})

          ### Verifying this download

          This APK is distributed outside Google Play, so the signature is the
          only thing tying it to this project. Check both before installing:

          \`\`\`
          sha256sum -c $APK.sha256
          apksigner verify --min-sdk-version 26 --print-certs $APK
          \`\`\`

          The output must contain this signer certificate SHA-256 digest (the
          label in front of it varies between apksigner versions):

          \`\`\`
          ${{ needs.build.outputs.fingerprint }}
          \`\`\`

          An APK signed with any other key is not from this project. NoSpam is
          your default SMS app, so this matters more than usual.
          EOF
          cat body.md

      - name: Create the GitHub Release
        # Third-party action, and deliberately in the job that has no keystore
        # and no secrets beyond the default token. Worth pinning to a commit SHA
        # rather than a tag if you want this supply-chain-hardened.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-apk/*.apk
            release-apk/*.sha256
          body_path: body.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version_name, 'alpha') || contains(needs.build.outputs.version_name, 'beta') || contains(needs.build.outputs.version_name, 'rc') }}
