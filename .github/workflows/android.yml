name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Skip the action's default package list. It asks for the legacy
          # "tools" package, which Google deprecated in 2019 and removed from
          # the SDK repository manifest on 2026-09-14, so sdkmanager exits 1
          # with "Failed to find package 'tools'". Every project on this action
          # broke the same day. An empty value still sets ANDROID_HOME and
          # pre-accepts the licences; AGP provisions the platform and
          # build-tools it needs. v4 did not change this: it still defaults to
          # "tools platform-tools", so the override stays necessary.
          packages: ''

      - name: Set up Gradle (caches dependencies, wrapper and build cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 made the default "enhanced" cache provider a proprietary
          # component under Gradle's commercial Terms of Use; on private repos
          # it is a free preview with usage-based pricing planned. "basic" is
          # the MIT-licensed provider, free forever, and caches the same
          # Gradle User Home content via actions/cache.
          cache-provider: basic

      # One invocation instead of three: configuring 18 modules three times
      # per run was pure overhead on top of the missing caching.
      - name: Build, compile device-test suites, and check coverage ratchet
        run: >
          ./gradlew build
          :feature:conversations:assembleDebugAndroidTest
          :feature:thread:assembleDebugAndroidTest
          :feature:settings:assembleDebugAndroidTest
          :core:telephony:assembleDebugAndroidTest
          :core:designsystem:assembleDebugAndroidTest
          :koverXmlReport :koverVerify
          --stacktrace

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-merged-report
          path: |
            build/reports/kover/html
            build/reports/kover/report.xml

# NOTE: connected tests (./gradlew connectedDebugAndroidTest) are intentionally
# not run here — they need an emulator with NoSpam set as the default SMS app.
# Run them locally per TASKS.md Phase 6.3 before release.
