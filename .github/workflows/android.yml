name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          # JetBrains, not Temurin: gradle/gradle-daemon-jvm.properties requires
          # a JETBRAINS 25 daemon JVM. With any other vendor installed, Gradle
          # downloads one into ~/.gradle/jdks on every run, and setup-gradle
          # doesn't cache that directory.
          distribution: jetbrains
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Skip the action's default package list. It asks for the legacy
          # "tools" package, which Google deprecated in 2019 and removed from
          # the SDK repository manifest on 2026-09-14, so sdkmanager exits 1
          # with "Failed to find package 'tools'". Every project on this action
          # broke the same day. An empty value still sets ANDROID_HOME and
          # pre-accepts the licences; AGP provisions the platform and
          # build-tools it needs. v4 did not change this: it still defaults to
          # "tools platform-tools", so the override stays necessary.
          packages: ''

      - name: Set up Gradle (caches dependencies, wrapper and build cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 made the default "enhanced" cache provider a proprietary
          # component under Gradle's commercial Terms of Use; on private repos
          # it is a free preview with usage-based pricing planned. "basic" is
          # the MIT-licensed provider, free forever, and caches the same
          # Gradle User Home content via actions/cache.
          cache-provider: basic
          # By default only main writes the cache, so every PR run started cold
          # until main had saved an entry. Writing on PRs too lets later pushes
          # to the same PR reuse that PR's cache. PR-scoped entries can't be read
          # by main, so this can't poison main's cache.
          cache-read-only: false

      # Debug only, plus a compile-only release check. `build` also packaged
      # release, benchmarkRelease and nonMinifiedRelease APKs and ran release
      # lintVital in every module: ~43% of the executed tasks, and nothing
      # consumed any of it. :app:compileReleaseKotlin still catches breakage
      # that only shows up in release (app/src/release, and the release
      # classpath without feature:export / feature:mldebug). The Kover "ci"
      # variant merges debug variants only; see the root build.gradle.kts.
      - name: Build, compile device-test suites, and check coverage ratchet
        run: >
          ./gradlew assembleDebug testDebugUnitTest lintDebug
          :core:model:test :core:common:test
          :app:compileReleaseKotlin
          :baselineprofile:compileNonMinifiedReleaseKotlin
          :feature:conversations:assembleDebugAndroidTest
          :feature:thread:assembleDebugAndroidTest
          :feature:settings:assembleDebugAndroidTest
          :core:telephony:assembleDebugAndroidTest
          :core:designsystem:assembleDebugAndroidTest
          :koverXmlReportCi :koverHtmlReportCi :koverVerifyCi
          --stacktrace

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-merged-report
          path: |
            build/reports/kover/htmlCi
            build/reports/kover/reportCi.xml

# NOTE: connected tests (./gradlew connectedDebugAndroidTest) are intentionally
# not run here — they need an emulator with NoSpam set as the default SMS app.
# Run them locally per TASKS.md Phase 6.3 before release.
