appId: com.nospam.nospam
tags:
  - inbox
---
# Long-press selection mode in the inbox, on a disposable fixture so this flow
# can freely mutate state without corrupting fixtures other flows depend on.
# Long-press replaces the top bar with a selection bar: three action icons
# (Pin, Archive, Delete) plus a ⋮ menu for the rest. Nothing floats over the list.
# NSTEST_MUTE1 is seeded read and muted, so the labels are "Mark as unread"
# and "Unmute". Requires tools/seed.sh seed.
- launchApp:
    clearState: false
    permissions:
      all: allow
- assertVisible: "Inbox"
- scrollUntilVisible:
    element:
        text: "NSTEST_MUTE1"
    direction: DOWN
    optional: true

# --- Selection bar and its actions ---
- longPressOn: "NSTEST_MUTE1"
- assertVisible: "1 selected"
- assertVisible: "Clear selection"
- assertVisible: "Pin"
- assertVisible: "Archive"
- assertVisible: "Delete"
- tapOn: "More options"
- assertVisible: "Mark as unread"
- assertVisible: "Star"
- assertVisible: "Unmute"
- assertVisible: "Add to contacts"
- assertVisible: "Call"
- assertVisible: "Report spam"
- assertVisible: "Block"
- back                                        # closes the menu, keeps the selection
- assertVisible: "1 selected"

# --- Tapping another row while selecting adds it instead of opening it ---
- tapOn: "NSTEST_STAR1"
- assertVisible: "2 selected"
- tapOn: "More options"
- assertNotVisible: "Call"                    # single-item actions leave with a 2nd row
- back
- tapOn: "NSTEST_STAR1"
- assertVisible: "1 selected"

# --- Pin from the bar; the action ends selection mode ---
- tapOn: "Pin"
- assertVisible: "Inbox"
- assertVisible: "Pinned"
- longPressOn: "NSTEST_MUTE1"
- assertVisible: "Unpin"
- tapOn: "Unpin"

# --- Star from the overflow menu ---
- scrollUntilVisible:
    element:
        text: "NSTEST_MUTE1"
    direction: DOWN
    optional: true
- longPressOn: "NSTEST_MUTE1"
- tapOn: "More options"
- tapOn: "Star"
- scrollUntilVisible:
    element:
        text: "NSTEST_MUTE1"
    direction: DOWN
    optional: true
- longPressOn: "NSTEST_MUTE1"
- tapOn: "More options"
- assertVisible: "Unstar"
- tapOn: "Unstar"

# --- Delete is confirmed; cancelling leaves the row and the selection alone ---
- scrollUntilVisible:
    element:
        text: "NSTEST_MUTE1"
    direction: DOWN
    optional: true
- longPressOn: "NSTEST_MUTE1"
- tapOn: "Delete"
- assertVisible: "Delete 1 conversation?"
- tapOn: "Cancel"
- assertVisible: "1 selected"

# --- System back leaves selection mode without acting ---
- back
- assertVisible: "Inbox"
- assertVisible: "NSTEST_MUTE1"
