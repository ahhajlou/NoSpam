appId: com.nospam.nospam
tags:
  - debug
---
# feature:export and feature:mldebug are debugImplementation-only (see
# docs/ARCHITECTURE-REVIEW.md A-1): they exist in the drawer of a debug build
# only, never release. Tagged `debug` so a release-shaped run can exclude this
# flow with --exclude-tags=debug.
- launchApp:
    clearState: false
    permissions:
      all: allow
- assertVisible: "NoSpam SMS"
- tapOn: "Menu"
- assertVisible: "Export SMS"
- assertVisible: "Classifier test"

# --- ML debug console ---
- tapOn: "Classifier test"
- assertVisible: "Paste a message and run the on-device spam classifier"
- tapOn: "Message text…"
- inputText: "WINNER free prize click now"
- tapOn: "Run classifier"
- extendedWaitUntil:
    visible: "Normalized text"
    timeout: 8000
- assertVisible: "Normalized text"
- assertVisible: "N-grams"
- back

# --- Export console: assert up to the file-save boundary and stop. ---
- tapOn: "Menu"
- tapOn: "Export SMS"
- assertVisible: "Export SMS"
- assertVisible: "Export all SMS messages to a JSONL file"
- assertVisible: "Include spam/ham labels"
- assertVisible: "Export all SMS"
- tapOn: "Export all SMS"
- extendedWaitUntil:
    visible: "Exported"
    timeout: 15000
- assertVisible: "Exported"
