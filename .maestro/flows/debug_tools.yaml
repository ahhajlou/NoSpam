appId: com.nospam.nospam
---
# The developer tools in the drawer: feature:export and feature:mldebug.
# Maestro matches an element's whole text, so a long string is asserted by its
# start plus ".*". The bare start does not match (this flow failed on main that
# way on 2026-10-15).
- launchApp:
    clearState: false
    permissions:
      all: allow
- assertVisible: "Inbox"
# Menu by id: its tooltip also reads "Open navigation menu" (see OPEN_MENU_TAG).
- tapOn:
    id: "open_navigation_menu"
- assertVisible: "Export SMS"
- assertVisible: "Classifier test"

# --- ML debug console ---
- tapOn: "Classifier test"
- assertVisible: "Paste a message and run the on-device spam classifier.*"
- tapOn: "Message text…"
- inputText: "WINNER free prize click now"
- tapOn: "Run classifier"
# The result lists each step of the Rust core first, so with the keyboard up the
# later rows sit under it, and a scroll gesture lands on the keyboard. Back
# closes the keyboard (not the screen) while it is open; hideKeyboard closed the
# screen here.
- extendedWaitUntil:
    visible: "Anonymized"
    timeout: 8000
- pressKey: Back
- assertVisible: "Paste a message and run the on-device spam classifier.*"
- scrollUntilVisible:
    element: "Normalized text"
    direction: DOWN
- scrollUntilVisible:
    element: "N-grams"
    direction: DOWN
- scrollUntilVisible:
    element: "Model pipeline"
    direction: DOWN
- scrollUntilVisible:
    element: "Core commit.*"
    direction: DOWN
- back

# --- Export console: assert up to the file-save boundary and stop. ---
- tapOn:
    id: "open_navigation_menu"
- tapOn: "Export SMS"
- assertVisible: "Export SMS"
- assertVisible: "Export the SMS you received to a JSONL file.*"
- assertVisible: "Include spam/ham labels"
- assertVisible: "Export received SMS"
- tapOn: "Export received SMS"
# The boundary: Android's file picker opens with our suggested name, and saving
# is left to a person. Cancel it, or it stays on top of the next flow.
- extendedWaitUntil:
    visible: "sms_export_[0-9_]+\\.jsonl"
    timeout: 15000
- repeat:
    while:
      visible: "sms_export_[0-9_]+\\.jsonl"
    times: 3
    commands:
      - pressKey: Back
- assertVisible: "Export received SMS"
