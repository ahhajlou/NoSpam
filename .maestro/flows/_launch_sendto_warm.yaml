appId: com.nospam.nospam
tags:
  - launch
  - manual-only
---
# Parts 2 and 2b of tools/launch_intents_check.sh: a "send SMS to" while the
# app already has a task, open on the inbox or with its process killed. It
# opens in a fresh task (LaunchConversationActivity); handed to the running
# activity it was lost after process death, and the inbox showed instead.
- assertVisible: ".*${ADDR}.*"
- assertVisible: "${TEXT}"
- tapOn: "Navigate up"
- assertVisible: "Inbox"
