appId: com.nospam.nospam
tags:
  - persistence
  - manual-only
# tools/persistence_check.sh passes a numeric ADDR (the emulator console keeps
# only a sender's digits); run on its own, the flow uses the seeded fixture.
env:
  ADDR: NSTEST_UNBLOCK1
---
# Part 1 of the block/unblock persistence regression check (commit 7256993).
# Not meant to run standalone in `maestro test .maestro/` — driven by
# tools/persistence_check.sh, which needs an `adb emu sms send` between this
# and part 2 (Maestro cannot shell out to the emulator console itself).
# Precondition: `adb emu sms send <ADDR> <text>` has already delivered
# one message, so the conversation exists in the inbox to long-press.
- launchApp:
    clearState: false
    permissions:
      all: allow
- assertVisible: "Inbox"
- longPressOn: ".*${ADDR}.*"
- tapOn: "More options"
- assertVisible: "Block"
- tapOn: "Block"
# Blocking is confirmed, because it reaches the system blocked-numbers list.
- assertVisible: "Block 1 sender?"
- tapOn: "Block"
- assertNotVisible: ".*${ADDR}.*"
