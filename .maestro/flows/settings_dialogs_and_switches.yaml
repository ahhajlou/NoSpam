appId: com.nospam.nospam
tags:
  - settings
---
# Settings is a landing page of sections, each on its own page (P1.6). This
# walks the sections, opens every dialog, and stops at the boundary where the
# app hands off to system Settings. Requires tools/seed.sh seed.
- launchApp:
    clearState: false
    permissions:
      all: allow
- assertVisible: "Inbox"
- tapOn: "Open navigation menu"
- tapOn: "Settings"
- assertVisible: "General"
- assertVisible: "Spam protection"
- assertVisible: "Advanced"
- assertVisible: "About"

# --- General: default-SMS status, notifications, language ---
- tapOn: "General"
- assertVisible: "Default SMS app"
- assertVisible: "NoSpam is default"          # role already held on this device
- assertVisible: "Notifications"
- assertVisible: "Bubbles"
- tapOn: "Language"
- assertVisible: "App language"
- assertVisible: "English"
- assertVisible: "فارسی"
- tapOn: "Close"
- assertNotVisible: "App language"
# Settings with no storage yet are visible but disabled, never live-looking.
- assertVisible: "Choose theme"
- tapOn: "Navigate up"

# --- Spam protection: the master switch round-trips ---
- tapOn: "Spam protection"
- assertVisible: "Filter spam, scams and phishing on this device"
- tapOn:
    rightOf: "Spam protection"
- tapOn:
    rightOf: "Spam protection"
- assertVisible: "Blocked and allowed senders"
- tapOn: "Navigate up"

# --- Advanced: re-check entry point and the data dialog ---
- tapOn: "Advanced"
- assertVisible: "Re-check all messages"
- tapOn: "Your data in Messages"
- assertVisible: ".*Messages stay in the system SMS store.*"
- tapOn: "Got it"
- assertNotVisible: "Got it"
- tapOn: "Navigate up"

# --- About ---
- tapOn: "About"
- assertVisible: "Version info"
- tapOn: "Terms of service"
- assertVisible: "Close"
- tapOn: "Close"
- tapOn: "Navigate up"
- assertVisible: "General"

# --- Boundary: Notifications leaves for system Settings.
# Tapping this launches ACTION_APP_NOTIFICATION_SETTINGS. Whether the OS screen
# appears is the platform's business; what matters here is the regression we own:
# the excursion does not crash us, and we come back to a working app. ---
- tapOn: "General"
- tapOn: "Notifications"
- back
- assertVisible: "Default SMS app"            # back on the General page, app alive
