appId: com.nospam.nospam
tags:
  - settings
  - senders
---
# Blocked and allowed senders (phase 2, P2.6). A rule belongs to the sender,
# not the conversation, so it must stay findable after the conversation is
# deleted, and undoable from Settings. Requires tools/seed.sh core.
- launchApp:
    clearState: false
    permissions:
      all: allow
- assertVisible: "Inbox"

# Block a sender, then delete its conversation.
- scrollUntilVisible:
    element: "NSTEST_STAR1"
- longPressOn: "NSTEST_STAR1"
- tapOn: "More options"
- tapOn: "Block"
- tapOn:
    text: "Block"
    index: 0
# Menu by id: its tooltip also reads "Open navigation menu" (see OPEN_MENU_TAG).
- tapOn:
    id: "open_navigation_menu"
- tapOn: "Spam & blocked"
- longPressOn: "NSTEST_STAR1"
- tapOn: "Delete"
- tapOn: "Delete"
- assertNotVisible: "NSTEST_STAR1"

# The rule is still there, and can be undone.
- tapOn:
    id: "open_navigation_menu"
- tapOn: "Settings"
- tapOn: "Spam protection"
- tapOn: "Blocked and allowed senders"
- assertVisible: "NSTEST_STAR1"
- tapOn:
    text: "Unblock"
    index: 0
- assertNotVisible: "NSTEST_STAR1"

# "Not spam" is listed as an allow, and removing it takes it off the page.
# Up by id: its tooltip also reads "Navigate up" (see NAVIGATE_UP_TAG).
- tapOn:
    id: "navigate_up"
- tapOn:
    id: "navigate_up"
- tapOn:
    id: "open_navigation_menu"
- tapOn: "Spam & blocked"
- longPressOn: "NSTEST_SPAM1"
- tapOn: "Not spam"
- tapOn:
    id: "open_navigation_menu"
- tapOn: "Settings"
- tapOn: "Spam protection"
- tapOn: "Blocked and allowed senders"
- assertVisible: "NSTEST_SPAM1"
- tapOn: "Remove"
- assertNotVisible: "NSTEST_SPAM1"
- assertVisible: "No senders marked as not spam"
