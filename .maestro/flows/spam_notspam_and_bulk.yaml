appId: com.nospam.nospam
tags:
  - spam
---
# Spam & blocked: selection mode, swipe to "Not spam", and a multi-row action.
# Rewritten 2026-09-17: the auto-delete banner and the Block all / Delete all
# row this flow used to assert were removed in 6898a35 because they were
# unconfirmed hard deletes. Requires tools/seed.sh seed (NSTEST_SPAM1,
# NSTEST_SPAM2 and NSTEST_BULK1 are pre-flagged SPAM).
- launchApp:
    clearState: false
    permissions:
      all: allow
- assertVisible: "Inbox"
- tapOn: "Open navigation menu"
- assertVisible: "Spam & blocked"
- tapOn: "Spam & blocked"
- assertVisible: "NSTEST_SPAM1"
- assertNotVisible: "Block all"
- assertNotVisible: "Delete all"

# --- Selection bar ---
- longPressOn: "NSTEST_SPAM1"
- assertVisible: "1 selected"
- assertVisible: "Not spam"
- assertVisible: "Block"
- assertVisible: "Delete"

# Delete is a hard delete from the SMS provider, so it is confirmed with a count.
- tapOn: "Delete"
- assertVisible: "Delete 1 conversation?"
- tapOn: "Cancel"
- assertVisible: "NSTEST_SPAM1"
- tapOn: "Clear selection"

# --- Swipe toward the end edge marks one conversation not spam ---
- swipe:
    from: "NSTEST_SPAM1"
    direction: RIGHT
- assertNotVisible: "NSTEST_SPAM1"
- assertVisible:
    text: ".*moved to Inbox.*"
    optional: true
- tapOn: "Open navigation menu"
- tapOn: "Inbox"
- scrollUntilVisible:
    element:
        text: "NSTEST_SPAM1"
    direction: DOWN
- assertVisible: "NSTEST_SPAM1"

# --- Two rows at once ---
- tapOn: "Open navigation menu"
- tapOn: "Spam & blocked"
- longPressOn: "NSTEST_BULK1"
- tapOn: "NSTEST_SPAM2"
- assertVisible: "2 selected"
- tapOn: "Not spam"
- assertNotVisible: "NSTEST_BULK1"
- assertNotVisible: "NSTEST_SPAM2"
